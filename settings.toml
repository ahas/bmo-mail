# The mail service's settings (docs/api.md, 「Settings」). A deployment's settings.local.toml overrides any
# key here, and BMO_MAIL_<TABLE>__<KEY> in the environment overrides both. A relative path is read from the
# settings folder.

[server]
# Where the service answers, as host:port: a loopback address, so only this machine reaches it.
listen = "127.0.0.1:3330"
# The bearer token every caller presents. A deployment names its own.
token = ""

[store]
# The SQLite file the labels, rules, settings, marks, known addresses and sender logos stand in.
path = "mail.db"

[accounts]
# The accounts file imported once into the store (docs/mail.md, 「The accounts file, imported once」) has no
# default: an instance run from source imports nothing.
file = ""
# The administrator's owner key: the imported accounts are its, and the harness plugin acts for it. A
# deployment names its own.
administrator = ""

[secrets]
# The key file an account's secrets are sealed with: 32 random bytes as base64 on one line. It has no default:
# an instance run from source keeps no account until its local settings name one, and a deployment names the
# data root's env/mail-secrets.key.
key_file = ""

[staging]
# The folder uploaded attachments wait in until the message carrying them is saved or sent.
dir = "mail-staging"

[console]
# The bundle build's folder: the module, the stylesheet, the words and the layer it was built on, which the
# service serves beside its manifest (docs/api.md, 「The console plugin bundle」). A deployment builds it into
# its release's console/; an instance run from source without it offers no console face.
dir = "console"
# The console's credential, which reaches the console face and the routes the screen uses. A deployment names
# it in settings.local.toml; empty, the service serves no console face.
token = ""

[wording]
# The language of the service's own words, under wording/, and of a list's order.
language = "ko"
# The time zone the service's own words write dates in.
time_zone = "Asia/Seoul"
