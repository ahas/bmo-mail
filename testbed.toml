# Generated from bmo-app.toml by bmo-app-sdk's bmo-app-declare.
# Change the manifest and run `bmo-app-declare bmo-app.toml` again; do not hand-edit this file.

testbed = 0
name = "bmo-mail"

# The shared base whose generator and skeletons this repository stands on.
upstreams = ["bmo-app-sdk"]

[test]
languages = ["cargo", "bun"]
# What a fresh tree lacks, laid before any unit runs.
setup = ["cd client && bun install --frozen-lockfile"]

[projects]
# The console bundle is a project of its own, its manifest and lockfile outside any package workspace.
paths = ["client"]
check_script = "check"

# The tool the service places on the tool host.
[tools]
dir = "tools"

[check]
# The sweeps that read the tree before anything runs.
quick = ["korean", "layout", "dependencies", "cargo-profile", "shared-versions", "personal-data"]
# The addresses the personal-data rule allows.
personal_data_allowed = ["dev@ahas.io"]
# The debt of Korean left in a code file; a file it does not name is allowed none.
korean_ledger = "korean-ledger.json"
# The base library the service crate takes by a path beside this checkout.
base_libraries = ["bmo-app-service", "bmo-chat", "bmo-chat-client", "bmo-console-face", "bmo-ui", "bmo-text"]

# The repository whose root holds the shared versions the manifests and the lock hold to.
[check.shared_versions]
repository = "bmo-chat"

# The console bundle is typechecked against its own install, as its check script does.
[[check.step]]
id = "client-typecheck"
dir = "client"
command = "bun install --frozen-lockfile && bun run typecheck"
when = ["client/**"]

[build]
binaries = ["bmo-mail"]

# The console bundle, installed and built in the build tree and written into the
# release being built, where the service reads its console folder from.
[[build.step]]
id = "console-install"
dir = "client"
command = "bun install --frozen-lockfile"

[[build.step]]
id = "console-bundle"
dir = "client"
lane = "wide"
command = "BMO_MAIL_CONSOLE_OUT=\"$(git rev-parse --show-toplevel)/../deploy-releases/$(git rev-parse HEAD | cut -c1-12)/console\" bun run bundle"

# The service's deploy tree and its data, kept apart from every release.
[deploy]
root = "~/.local/share/bmo-mail"
link = "deploy"
data_root = "~/.local/share/bmo/data"
# The deployed settings each release links beside its own.
env_links = [{ link = "settings.local.toml", target = "env/mail.toml" }]
units = ["deploy/*.service"]
health = "~/.local/share/bmo-mail/deploy/bin/bmo-mail health"

# The screen the service brings to a console, whose face the deployment probes once
# the service is up.
[deploy.console]
reach = "bin/bmo-mail console-reach"

# The tool placed in its folder's .placed/, the folder the tool host reads: the executable
# the release's bin/ holds, its manifest, its manual and the schemas beside it.
[[deploy.step]]
id = "place-sent-mail-tool"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/sent-mail/.placed
mkdir -p tools/sent-mail/.placed
cp bin/bmo-mail tools/sent-mail/tool.toml tools/sent-mail/manual.md tools/sent-mail/*.json tools/sent-mail/.placed/
'''

# The placed tool registered with the tool host under this service's name, carrying the
# capability its entries ask for.
[[deploy.step]]
id = "register-sent-mail-tool"
phase = "after-health"
command = '''
set -eu
bmo pocket put tools/sent-mail/.placed --placed --service bmo-mail --allow room.tools
'''
