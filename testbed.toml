# How the testbed checks, builds and deploys this repository, in the testbed's declaration format. The quick
# checks hold the personal-data rule (PERSONAL-DATA.md); the behaviour tests are deferred (README.md).

testbed = 0
name = "bmo-mail"

[test]
# The Cargo workspace's crate, and the TypeScript console plugin under client/, a Bun project whose check
# script is its typecheck and its browser tests.
languages = ["cargo", "bun"]
# A fresh tree gets the client's locked packages through the same frozen install its check step runs.
setup = ["cd client && bun install --frozen-lockfile"]

[projects]
# The console plugin bundle under client/ is a project of its own: its manifest stands outside any package
# workspace. Bun runs its check script in the suite: the install, the typecheck and the browser tests, one file
# after another, since the testbed gathers no test file inside a project. The client-typecheck step below runs
# the same install and typecheck in the static check.
paths = ["client"]
check_script = "check"

[check]
# The sweeps that read the tree before anything runs: Korean in the code, the README's folder table and the
# dependencies the manifests name. The ledger is the count of lines with Korean each file may hold, a file it
# does not name being allowed none: the service's own Korean words stand there.
quick = ["korean", "layout", "dependencies", "cargo-profile", "shared-versions", "personal-data"]
# The one address PERSONAL-DATA.md allows.
personal_data_allowed = ["dev@ahas.io"]
korean_ledger = "korean-ledger.json"
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-console-face", "bmo-ui", "bmo-text"]

# The repository whose root holds the shared versions the manifests and the lock hold to.
[check.shared_versions]
repository = "bmo-chat"

# The testbed formats, lints and type-checks the crate itself; the declared steps add only the console plugin
# bundle, a project of its own under client/, typechecked against its own install.
[[check.step]]
id = "client-typecheck"
dir = "client"
command = "bun install --frozen-lockfile && bun run typecheck"
when = ["client/**"]

[build]
binaries = ["bmo-mail"]

# The console bundle the service serves (docs/api.md, 「The console plugin bundle」), built in the build tree, where
# its install and Nuxt's generated project stay warm between deployments, and written into the release being
# built: the release beside the build tree, named by the first twelve hex digits of the commit (the testbed's
# docs/deploy.md, 「The places」). Its console/ is the folder the setting console.dir names by default, read once
# as the service starts.
[[build.step]]
id = "console-install"
dir = "client"
command = "bun install --frozen-lockfile"

[[build.step]]
id = "console-bundle"
dir = "client"
lane = "wide"
command = "BMO_MAIL_CONSOLE_OUT=\"$(git rev-parse --show-toplevel)/../deploy-releases/$(git rev-parse HEAD | cut -c1-12)/console\" bun run bundle"

# The service's own deploy tree, and the data root its settings stand under: the data root's env/mail.toml,
# which each release links to as settings.local.toml, the file the service reads beside settings.toml
# (docs/api.md, 「Settings」). It names the token, the accounts file and a store path under the data root.
[deploy]
root = "~/.local/share/bmo-mail"
link = "deploy"
data_root = "~/.local/share/bmo/data"
env_links = [{ link = "settings.local.toml", target = "env/mail.toml" }]
# The service's user unit, marked bot: the repository's one service, whose health the deployment waits on.
units = ["deploy/*.service"]
# Answers 0 once the service the deployed settings name answers ready (docs/api.md, 「Health」).
health = "~/.local/share/bmo-mail/deploy/bin/bmo-mail health"

[deploy.console]
# The service brings the mail screen to a console; once it is up the deployment probes its console face
# (docs/api.md, 「The console plugin bundle」). Run from the release, the command prints how a console reaches the
# service from the release's settings (docs/api.md, 「The command」).
reach = "bin/bmo-mail console-reach"
